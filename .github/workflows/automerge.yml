name: automerge
# No human step per pull request: whether a change lands is decided by the tests. Every pull
# request opened ready for review gets GitHub's own auto-merge armed when it opens; GitHub merges it
# once the required checks in .github/rulesets/main.json are green. A draft is left alone.
#
# It can never land an untested change: it arms only when main really carries a required-checks
# rule, and it arms through GraphQL's enablePullRequestAutoMerge, which waits for the checks and
# never merges on the spot (`gh pr merge --auto` merges at once a pull request nothing blocks).
#
# The rule is strict (strict_required_status_checks_policy): a pull request whose branch fell
# behind main waits until it carries main, since the checks ran on a tree main would never hold
# (measured 2026-10-08 over the parallel streams' merges: without it, main's tree after each was
# not what the checks ran on). Bringing the branch up to date is the session's own step, merge
# main in, gate, push: a push a bot makes with GITHUB_TOKEN starts no workflow, so no automation
# here does it, and a pull request nobody drives (its session gone) waits there until a person
# clicks Update branch or merges main into it.
#
# The merge is made as whoever armed it, and GitHub starts no workflow for an event GITHUB_TOKEN
# caused: armed with the workflow token, a merge ran none of main's push workflows and left the
# issue its "Closes #N" names open (measured 2026-10-23 in OpenSpineConsortium/SchwingNet, #174 and
# #167). So where the repository has the SymphonyBoard App (the variable SDLC_APP_ID and the secret
# SDLC_APP_PRIVATE_KEY, as a Symphony repository does), it arms with the App's installation token
# for this repository alone, and the merge starts main's workflows like a person's. The token asks
# for workflows too, since merging a change to .github/workflows/ needs it, and an installation
# that does not grant it is asked again without; with no App, no token, or an App that may not
# arm, it arms with GITHUB_TOKEN as before.
on:
  pull_request:
    types: [opened, reopened, ready_for_review]

# Nothing at the top; the one job that writes says so (OpenSSF Scorecard's Token-Permissions).
permissions: {}

jobs:
  arm:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 5
    steps:
      - name: the SymphonyBoard App's token, where the repository has the App
        id: app
        if: ${{ vars.SDLC_APP_ID != '' }}
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.SDLC_APP_ID }}
          private-key: ${{ secrets.SDLC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - name: the App's token without workflows, where the installation does not grant them
        id: app-core
        if: ${{ vars.SDLC_APP_ID != '' && steps.app.outputs.token == '' }}
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.SDLC_APP_ID }}
          private-key: ${{ secrets.SDLC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: arm auto-merge when main requires the checks
        env:
          GH_TOKEN: ${{ github.token }}
          ARM_TOKEN: ${{ steps.app.outputs.token || steps.app-core.outputs.token || github.token }}
          ARMED_BY: ${{ (steps.app.outputs.token || steps.app-core.outputs.token) && 'the SymphonyBoard App, so the merge starts main''s workflows' || 'GITHUB_TOKEN, so the merge starts no workflow on main' }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.ref }}
          PR_ID: ${{ github.event.pull_request.node_id }}
        run: |
          set -uo pipefail
          n=$(gh api "repos/$REPO/rules/branches/$BASE" --jq '[.[] | select(.type == "required_status_checks")] | length') || n=0
          if [ "${n:-0}" = 0 ]; then
            echo "::notice::$BASE has no required-checks rule yet (.github/rulesets/main.json is not applied), so auto-merge stays off: armed now, it would merge before the tests."
            exit 0
          fi
          arm() {
            GH_TOKEN="$1" gh api graphql -f query='mutation($id: ID!) { enablePullRequestAutoMerge(input: {pullRequestId: $id, mergeMethod: MERGE}) { pullRequest { number autoMergeRequest { enabledAt } } } }' -f id="$PR_ID" 2>&1
          }
          if out=$(arm "$ARM_TOKEN"); then
            echo "auto-merge armed by $ARMED_BY: the pull request merges when the required checks are green"
          elif [ "$ARM_TOKEN" != "$GH_TOKEN" ] && out2=$(arm "$GH_TOKEN"); then
            echo "::notice::the App could not arm auto-merge ($out), so GITHUB_TOKEN armed it: the merge starts no workflow on main"
          else
            echo "::notice::auto-merge not armed: $out ${out2:-}"
          fi
