# Deterministic environment for beethoven-qa, the code-writing and verification framework of the
# Beethoven engine (REFORMS: reproducibility).
# The lock beside this file (pixi.lock) is the record: exact versions, build strings and hashes,
# solved for the grid's platform. A run is only reproducible if it is reconstructed from the lock
# alone, so CI installs with --locked and never re-solves silently.
#
# Scope note: this environment carries the verification stack (Goal 1) and the dev tooling the gate
# needs, and nothing else. Orchestration (Metaflow) belongs to beethoven-agents and the medical and
# telemetry stacks to the research pipeline (plan/REPO_SPLIT.md); each locks its own environment,
# with a pinned copy of this package in it, so this lock stays small and every repository's gate is
# the same code.

[workspace]
name = "beethoven-qa"
version = "0.0.0"
description = "Beethoven code-writing and verification framework: contracts, layered types, the CrossHair/Z3 gate"
channels = ["conda-forge"]
# linux-64 only: every engine job runs inside the Apptainer image on the cluster's x86_64 compute nodes,
# and the lock must match the platform a run actually executes on. Dev-laptop platforms (osx-arm64,
# linux-aarch64) can be added here when someone needs them; each widens the solve and the lock.
platforms = [{ name = "linux-64-glibc234", platform = "linux-64", glibc = "2.34" }]
# glibc 2.34 or later, because jscpd (the duplication detector, from PyPI) ships manylinux_2_34
# wheels only. The Apptainer image (ubuntu:24.04), GitHub's runners and a cloud session all have
# it; the grid's CentOS 7 login node (2.17) never runs the gate, by the grid rules.
# Same-name derivation is off so the solve does not depend on an external conda<->PyPI mapping
# host. The cost is an overlap the lock does record: CrossHair's PyPI requirements bring PyPI copies
# of packaging, typing-extensions and mypy-extensions beside conda-forge's, at the same versions,
# and `pixi install` warns that the PyPI files overwrite the conda ones. Harmless while the versions
# match; revisit if a lock ever pins them apart.
conda-pypi-map = false

[dependencies]
# Pinned low bounds only; the lock pins the exact build. conda-forge is the primary channel
# (REFORMS prefers it); the two tools that are not packaged there come from PyPI below.
python = "3.11.*"
pip = "*"
# --- Goal 1: contracts and layered runtime types ---
icontract = ">=2.6"      # Design by Contract: @require / @ensure / invariants
pydantic = ">=2"         # external-boundary validation (O(N) coercion)
beartype = ">=0.18"      # internal hot-path checks (amortized O(1))
typeguard = ">=4"        # test-enclave runtime checking
# --- dev tooling the gate runs ---
pytest = ">=8"
ruff = ">=0.6"           # lint + format check
mypy = ">=1.10"          # static types, the layer above the runtime checks
# --- the code standards (beethoven_qa.standards), one group per standard of the Drive file
# "Auditable Code Quality Standards". Each tool runs as its own process and is read through its
# JSON output; ruff above serves the readability group as well.
complexipy = ">=8"       # readability: cognitive complexity (Campbell, SonarSource)
radon = ">=6"            # design: McCabe complexity per method, the weights of WMC
bandit = ">=1.9"         # security: weaknesses mapped to CWE (the catalogue ISO/IEC 5055 is built on)
coverage = ">=7.10"      # coverage: line coverage of the tests, read for the new lines only
pyyaml = ">=6"           # supply chain: the workflow files
types-pyyaml = ">=6"     # mypy's stubs for pyyaml
jsonschema = ">=4"       # tests only: every SARIF file validates against the OASIS 2.1.0 schema
zizmor = ">=1.30"        # supply chain: the established auditor of the workflow files, beside the reader here
lizard = ">=1.24"        # readability: lines of code per function (NLOC)

[pypi-dependencies]
# The symbolic-proof layer. CrossHair is published on PyPI only (not conda-forge); it pulls in
# z3-solver itself, so z3 is not declared separately (the overlap it brings is described above).
crosshair-tool = ">=0.0.60"
# The duplication detector (Rabin-Karp over tokens), published on PyPI as a self-contained binary
# wheel (manylinux_2_34; the glibc floor above). Read through its JSON report.
jscpd = ">=5.4"

[activation]
# The package is imported from src/ without a build step. Absolute, so `pixi run --manifest-path`
# from another checkout (the vendor command, run from a consumer) finds it too.
env = { PYTHONPATH = "$PIXI_PROJECT_ROOT/src" }

[tasks]
# The verification gate, in the order a module must clear it. The pre-push hook runs
# `pixi run --locked gate`; CI runs the same tasks one by one after `pixi install --locked`, so a
# failure names its lane. Both read the same lock, so they check the same environment.
lint = "ruff check src tests && ruff format --check src tests"
typecheck = "mypy src"
test = "pytest -q"
# Every public function carries contracts, and CrossHair proves no input satisfies a precondition
# while violating a postcondition, within the declared bound per condition. A package with nothing
# to prove fails, never passes (src/beethoven_qa/gate.py says what else it refuses).
symbolic = "python -m beethoven_qa gate"
# The code standards, each group on its own (docs/STANDARDS.md), on the code new since where this
# branch left the remote's default branch; CI runs each group as its own job (standards.yml).
standards = "python -m beethoven_qa standards all"
# The interface standard's five rules (interface/README.md): no file of this tree reaches another
# checkout, interface/INTERFACE.json says what this repository offers, and whatever it takes from
# another is a pinned copy with its ORIGIN. It reads what git tracks and needs no network.
boundary = "python -m beethoven_qa boundary"
gate = { depends-on = ["lint", "typecheck", "test", "boundary", "symbolic", "standards"] }
# The gate before every push, not only in CI: one command points git at the repository's hooks.
hooks = "git config core.hooksPath .githooks"
